<text x="196" y="264.4" font-size="2.2" text-anchor="end" fill="#222">همهٔ اعداد جدول و اندازه‌های روی نقشه مستقیماً از محاسبات فایل اکسل گرفته شده‌اند. چیدمان قطعات نمایشی است و ادعایی</text>
