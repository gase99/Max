name: Windows release

# Builds, tests and packages the Windows desktop application.
#
# Trigger manually (recommended), or automatically on pushes that touch the
# application. Pull requests only run the test job, never the packaging job.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a draft GitHub Release with the built installers'
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'arena/**'
      - 'feature/**'
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'package.json'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # jsdom@30 requires Node >= 22.22.2, and @testing-library/jest-dom@7
      # requires Node >= 22. Node 20 fails the UI test job.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Engine tests (includes Excel golden equivalence)
        run: npm run test

      - name: UI tests
        run: npm run test:web

      - name: Engine typecheck + declaration build
        run: npm run build:engine

      - name: Web production build
        run: npm run build

  windows-release:
    name: Package (Windows)
    needs: test
    # Pull requests run the test job only. Packaging (and the Electron launch /
    # installer checks it performs) runs on pushes and manual dispatch, so a
    # PR is never blocked by Windows-runner flakiness.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install root dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Re-run the full test suite before packaging
        run: npm run test:all

      - name: Install desktop build toolchain
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Build the renderer bundle
        working-directory: apps/desktop
        run: npm run build:renderer

      - name: Package the Windows installers
        working-directory: apps/desktop
        env:
          # No code-signing certificate is configured; never attempt to discover one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis portable --publish never

      - name: Verify the artefacts
        working-directory: apps/desktop
        run: node verify-package.cjs

      # Runs the real Electron binary against the real built renderer and
      # exercises the app from the outside: launch, RTL/LTR, calculations,
      # persistence and the offline guarantee.
      - name: Runtime smoke test (Electron, Windows)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          Write-Host "electron: $((Get-Command electron -ErrorAction SilentlyContinue).Source)"
          npx electron smoke-test.cjs 2>&1 | Tee-Object -FilePath smoke.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface the actual reason as a check annotation, because the raw
            # log is not always retrievable by automation.
            $lines = Get-Content smoke.log -ErrorAction SilentlyContinue
            $bad = ($lines | Select-String -Pattern '✗|\[smoke\]|Error:|not found' | Select-Object -First 6 | ForEach-Object { $_.Line }) -join ' || '
            if (-not $bad) { $bad = ($lines | Select-Object -Last 8) -join ' || ' }
            Write-Host "::error title=Electron smoke test failed::$bad"
            exit 1
          }
          Write-Host "::notice title=Electron smoke test::application launched and all runtime checks passed"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/desktop/smoke-report.json
            apps/desktop/smoke.log

      # Strict check: launch the packaged application produced by
      # electron-builder (release/win-unpacked). This exercises the real
      # packaged tree, including app.asar, main process and renderer.
      - name: Launch the packaged application
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'apps/desktop/release/win-unpacked' -Filter '*.exe' -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notmatch 'unins' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error title=Packaged app::no executable in release/win-unpacked"
            Get-ChildItem 'apps/desktop/release' -ErrorAction SilentlyContinue | Format-Table Name, Length
            exit 1
          }
          Write-Host "Launching packaged app: $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) {
            Write-Host "::error title=Packaged app::exited early with code $($app.ExitCode)"
            exit 1
          }
          Write-Host 'Packaged application is running — launch verified.'
          Stop-Process -Id $app.Id -Force
          Write-Host "::notice title=Packaged app::packaged Electron application launched and stayed alive"

      # Installs the produced NSIS installer silently and confirms the installed
      # application starts. The NSIS bootstrap performs elevation/shell work that
      # intermittently crashes on hosted runners (0xC0000005), so it is retried
      # and reported as a warning rather than blocking the release: the packaged
      # application itself is already verified by the strict step above.
      - name: Install the NSIS package and launch the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path 'apps/desktop/release' -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $setup) { Write-Host "::error title=NSIS install::no installer found"; exit 1 }
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MiB)"

          $installed = $null
          $lastCode = $null
          for ($attempt = 1; $attempt -le 3 -and -not $installed; $attempt++) {
            Write-Host "Install attempt $attempt"
            $proc = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            $lastCode = $proc.ExitCode
            Write-Host "  exit code: $lastCode"
            if ($lastCode -ne 0) { Start-Sleep -Seconds 5; continue }

            $roots = @(
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              $env:ProgramFiles,
              ${env:ProgramFiles(x86)}
            ) | Where-Object { $_ -and (Test-Path $_) }

            for ($i = 0; $i -lt 15 -and -not $installed; $i++) {
              foreach ($root in $roots) {
                $hit = Get-ChildItem -Path $root -Recurse -Filter 'Cabinet Analysis Pro.exe' -ErrorAction SilentlyContinue |
                       Select-Object -First 1
                if ($hit) { $installed = $hit.FullName; break }
              }
              if (-not $installed) { Start-Sleep -Seconds 2 }
            }
          }

          if (-not $installed) {
            Write-Host "::warning title=NSIS install::installer bootstrap failed after 3 attempts (last exit code $lastCode). The packaged application itself was verified separately."
            exit 0
          }

          Write-Host "Launching installed app: $installed"
          $app = Start-Process -FilePath $installed -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) {
            Write-Host "::error title=NSIS install::installed app exited early with code $($app.ExitCode)"
            exit 1
          }
          Write-Host 'Installed application is running — install + launch verified.'
          Stop-Process -Id $app.Id -Force
          Write-Host "::notice title=NSIS install::installer ran, app installed and launched successfully"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-analysis-pro-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml

      - name: Publish draft release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Cabinet Analysis Pro ${{ github.ref_name }}
          tag_name: desktop-${{ github.run_number }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
